version: '3.8'

services:
  backend:
    build: ./backend
    container_name: interview-assistant-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - GOOGLE_CALENDAR_CREDENTIALS=${GOOGLE_CALENDAR_CREDENTIALS}
    volumes:
      - ./backend:/app
    depends_on:
      - chromadb

  chromadb:
    image: chromadb/chroma:latest
    container_name: interview-assistant-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/data

volumes:
  chroma-data:
